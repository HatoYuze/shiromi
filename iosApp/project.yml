# shiromi iOS 工程定义（XcodeGen，单一事实来源；生成的 shiromi.xcodeproj 不入库）。
# 生成：cd iosApp && xcodegen generate（CI 与本地 macOS 开发均用此命令）。
# 本地开发需 Xcode 15.3+、JDK 17；首次打开前先执行上述生成命令。
# 签名参数（DEVELOPMENT_TEAM / CODE_SIGN_STYLE / MARKETING_VERSION）由构建环境
# （CI 的 xcodebuild 命令行）注入，本文件保持可移植。

name: shiromi
options:
  bundleIdPrefix: com.github.hatoyuze
  deploymentTarget:
    iOS: "15.6"
  createIntermediateGroups: true
settings:
  base:
    # 允许 "Compile Kotlin Framework" 脚本阶段写 BUILT_PRODUCTS_DIR
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  shiromi:
    type: application
    platform: iOS
    sources:
      - path: shiromi
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.hatoyuze.shiromi
        PRODUCT_NAME: shiromi
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        INFOPLIST_KEY_CFBundleDisplayName: shiromi
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "shiromi/Preview Content"
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # KMP 插件把静态 ComposeApp.framework 组装到 build/xcode-frameworks/<CONFIG>/<SDK_NAME>
        # 并在 BUILT_PRODUCTS_DIR 建符号链接；链接靠 OTHER_LDFLAGS 完成，无需工程内框架引用。
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(BUILT_PRODUCTS_DIR)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          - "-lsqlite3"
schemes:
  shiromi:
    build:
      targets:
        shiromi: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
