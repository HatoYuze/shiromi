kotlin.code.style=official
# -Xmx6g: iOS Release framework 链接（K/N LTO DevirtualizationAnalysis）在 4g 下 OOM
# （Java heap space, linkReleaseFrameworkIosSimulatorArm64）；桌面/Android 构建同样受益。
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8

# Android SDK levels (consumed by composeApp / lib:luogu-protocol build scripts)
COMPILE_SDK=36
TARGET_SDK=36
# minSdk 28: 与 vendored wvbridge core（com.android.kotlin.multiplatform.library, minSdk 28）对齐
MIN_SDK=28
android.nonTransitiveRClass=true
android.useAndroidX=true
